name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Baseline checks
        run: bash scripts/check-rust.sh

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true
      - name: Verify pinned Gradle version
        shell: bash
        run: |
          set -euo pipefail
          test "$(gradle --version | sed -n 's/^Gradle //p' | head -n1)" = "9.5.0"
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          yes | sdkmanager "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
      - name: Cross-build Rust JNI library
        run: bash scripts/build-android-rust.sh
      - name: Build, unit test, and lint
        run: bash scripts/check-android.sh

  firmware:
    name: ESP-IDF firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ESP-IDF
        shell: bash
        run: |
          set -euo pipefail
          IDF_ROOT="${RUNNER_TEMP}/esp-idf"
          ESP_IDF_ROOT="${IDF_ROOT}" bash scripts/install-esp-idf.sh
          IDF_VERSION="$(tr -d '[:space:]' < firmware/IDF_VERSION)"
          IDF_PATH="${IDF_ROOT}/esp-idf-${IDF_VERSION}"
          test -f "${IDF_PATH}/export.sh"
          echo "IDF_PATH=${IDF_PATH}" >> "${GITHUB_ENV}"
      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          bash scripts/check-firmware.sh

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed build products
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(target|build)/|\.apk$|\.aab$|\.elf$|\.bin$|\.so$' ; then
            echo 'Tracked build/release product detected.' >&2
            exit 1
          fi
      - name: Validate pinned toolchain files
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < firmware/IDF_VERSION)" = "v5.5.5"
          grep -Fq 'channel = "1.88.0"' rust-toolchain.toml
          grep -Fq 'gradle-9.5.0-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'NDK_VERSION="27.2.12479018"' .github/workflows/ci.yml
      - name: Check whitespace
        run: git diff --check

  release-assets:
    name: Tagged release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, android, firmware, repository-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Build source bundle
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="android-subtitles-anywhere-${GITHUB_REF_NAME}/" \
            -o "android-subtitles-anywhere-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "android-subtitles-anywhere-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "android-subtitles-anywhere-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
